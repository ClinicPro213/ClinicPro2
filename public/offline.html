<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل - ClinicPro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h2 {
            color: #1e40af;
            margin-bottom: 15px;
        }
        p {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        button {
            background: #1e40af;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #3b82f6;
            transform: scale(1.02);
        }
        .retry-icon {
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h2>أنت غير متصل بالإنترنت</h2>
        <p>الرجاء التحقق من اتصالك بالإنترنت<br>ثم حاول مرة أخرى</p>
        <button onclick="location.reload()">
            <i class="fas fa-sync-alt"></i> محاولة مرة أخرى
        </button>
    </div>
</body>
</html>
